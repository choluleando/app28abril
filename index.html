<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#dd9933">
    <meta name="description" content="Cotizador oficial DINAMO - Financia tu motocicleta">
    <title>Cotizador DINAMO | Financia tu Moto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            gap: 12px;
        }

        .header {
            background: linear-gradient(135deg, #dd9933 0%, #c97d1f 100%);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(221, 153, 51, 0.3);
        }

        .header-logo {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #dd9933;
            font-size: 24px;
            flex-shrink: 0;
        }

        .header-text h1 {
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-text p {
            color: rgba(255,255,255,0.85);
            font-size: 11px;
            font-weight: 600;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title span {
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 11px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: #333;
        }

        select:focus {
            outline: none;
            border-color: #dd9933;
            box-shadow: 0 0 0 3px rgba(221, 153, 51, 0.1);
        }

        .buttons-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 6px;
        }

        .btn {
            padding: 9px 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: all 0.25s;
            text-align: center;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.active {
            background: linear-gradient(135deg, #dd9933 0%, #c97d1f 100%);
            color: white;
            border-color: #dd9933;
            box-shadow: 0 3px 10px rgba(221, 153, 51, 0.3);
        }

        .moto-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .moto-preview img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: white;
            border-radius: 6px;
            padding: 4px;
        }

        .moto-info {
            flex: 1;
        }

        .moto-info-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .moto-info-desc {
            font-size: 11px;
            color: #666;
            line-height: 1.3;
        }

        .cotizacion {
            margin-top: 8px;
            padding: 14px;
            background: linear-gradient(135deg, #f9f9f9 0%, #f0f0f0 100%);
            border-radius: 10px;
            border-left: 4px solid #dd9933;
        }

        .cotizacion h2 {
            font-size: 14px;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cotizacion-grid {
            display: grid;
            gap: 8px;
        }

        .cotizacion-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cotizacion-label {
            color: #666;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .cotizacion-valor {
            color: #dd9933;
            font-size: 14px;
            font-weight: 700;
        }

        .cotizacion-total {
            background: linear-gradient(135deg, #dd9933 0%, #c97d1f 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            box-shadow: 0 3px 10px rgba(221, 153, 51, 0.3);
        }

        .cotizacion-total-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .cotizacion-total-valor {
            font-size: 18px;
            font-weight: 700;
        }

        .cotizacion-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-action {
            padding: 11px 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-email {
            background: linear-gradient(135deg, #dd9933 0%, #c97d1f 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(221, 153, 51, 0.2);
        }

        .btn-email:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(221, 153, 51, 0.3);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .hidden {
            display: none;
        }

        .whatsapp-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            transition: all 0.3s;
            z-index: 1000;
        }

        .whatsapp-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-button:active {
            transform: scale(0.95);
        }

        .whatsapp-modal {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0,0,0,0.16);
            width: 360px;
            max-width: 90vw;
            overflow: hidden;
            z-index: 999;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .whatsapp-header {
            background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .whatsapp-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .whatsapp-close {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        .whatsapp-content {
            padding: 16px;
        }

        .whatsapp-message {
            font-size: 13px;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .whatsapp-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .whatsapp-input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .whatsapp-input::placeholder {
            color: #999;
        }

        .whatsapp-input:focus {
            outline: none;
            border-color: #25d366;
            box-shadow: 0 0 0 2px rgba(37, 211, 102, 0.1);
        }

        .whatsapp-send {
            padding: 11px;
            background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .whatsapp-send:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-send:active {
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #dd9933;
            border-radius: 2px;
        }

        @media (max-width: 480px) {
            .app-container {
                padding-top: 6px;
                padding-left: 6px;
                padding-right: 6px;
            }

            .header {
                padding: 12px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .header-text h1 {
                font-size: 16px;
            }

            .header-text p {
                font-size: 10px;
            }

            .content {
                padding: 12px;
                gap: 12px;
            }

            .buttons-group {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
                gap: 5px;
            }

            .btn {
                font-size: 10px;
                padding: 8px 8px;
            }

            .moto-preview img {
                width: 70px;
                height: 70px;
            }

            .moto-info-title {
                font-size: 13px;
            }
        }
    </style>
</head>

    <div class="app-container">
        <div class="header">
            <div class="header-logo">🏍</div>
            <div class="header-text">
                <h1>DINAMO</h1>
                <p>Cotizador Oficial | Financia tu Moto</p>
            </div>
        </div>

        <div class="content">
            <!-- Selección de modelo -->
            <div class="section">
                <div class="section-title">
                    <span>🏍️</span>
                    <span>Modelo</span>
                </div>
                <select id="modeloSelect">
                    <option value="">-- Selecciona una motocicleta --</option>
                </select>
                <div id="motoPreview"></div>
            </div>

            <!-- Selección de crédito -->
            <div class="section">
                <div class="section-title">
                    <span>💳</span>
                    <span>Tipo de Financiamiento</span>
                </div>
                <div class="buttons-group" id="creditoGroup">
                    <button class="btn" data-credito="CREDINAMO">CREDINAMO</button>
                    <button class="btn" data-credito="MOTONOMINA">MOTONOMINA</button>
                    <button class="btn" data-credito="MOTOXPRESS">MOTOXPRESS</button>
                    <button class="btn" data-credito="MSI">MSI (0%)</button>
                </div>
            </div>

            <!-- Selección de enganche -->
            <div class="section" id="engancheSection">
                <div class="section-title">
                    <span>💰</span>
                    <span>Enganche</span>
                </div>
                <div class="buttons-group" id="engancheGroup"></div>
            </div>

            <!-- Selección de plazo -->
            <div class="section" id="plazoSection">
                <div class="section-title">
                    <span>📅</span>
                    <span>Plazo (Quincenas)</span>
                </div>
                <div class="buttons-group" id="plazoGroup"></div>
            </div>

            <!-- Cotización -->
            <div id="cotizacionContainer"></div>
        </div>
    </div>

    <!-- WhatsApp Button -->
    <button class="whatsapp-button" id="whatsappBtn" title="Contactar por WhatsApp">💬</button>

    <!-- WhatsApp Modal -->
    <div class="whatsapp-modal hidden" id="whatsappModal">
        <div class="whatsapp-header">
            <h3>💬 Contacta con DINAMO</h3>
            <button class="whatsapp-close" id="whatsappClose">✕</button>
        </div>
        <div class="whatsapp-content">
            <p class="whatsapp-message">¿Tienes preguntas sobre tu cotización? Contacta con nuestros asesores por WhatsApp</p>
            <div class="whatsapp-form">
                <input type="text" class="whatsapp-input" id="whatsappName" placeholder="Tu nombre">
                <input type="email" class="whatsapp-input" id="whatsappEmail" placeholder="Tu correo (opcional)">
                <textarea class="whatsapp-input" id="whatsappMessage" placeholder="Tu mensaje..." rows="3" style="resize: none;"></textarea>
                <button class="whatsapp-send" id="whatsappSendBtn">Enviar por WhatsApp</button>
            </div>
        </div>
    </div>

        const select = document.getElementById('modeloSelect');

        const engancheSection = document.getElementById('engancheSection');
        const engancheGroup = document.getElementById('engancheGroup');
        const plazoSection = document.getElementById('plazoSection');
        const plazoGroup = document.getElementById('plazoGroup');
        const cotizacionContainer = document.getElementById('cotizacionContainer');
        const motoPreview = document.getElementById('motoPreview');

        let modeloSeleccionado = '';
        let creditoSeleccionado = '';
        let engancheSeleccionado = '';
        let plazoSeleccionado = '';

        // Cargar modelos
        Object.keys(datos).sort().forEach(modelo => {
            const option = document.createElement('option');
            option.value = modelo;
            option.textContent = modelo;
            select.appendChild(option);
        });

        select.addEventListener('change', function() {
            modeloSeleccionado = this.value;
            creditoSeleccionado = '';
            engancheSeleccionado = '';
            plazoSeleccionado = '';
            
            if (modeloSeleccionado && motoData[modeloSeleccionado]) {
                const moto = motoData[modeloSeleccionado];
                motoPreview.innerHTML = `
                    <div class="moto-preview">
                        <img src="${moto.imagen}" alt="${modeloSeleccionado}" style="width: 80px; height: 80px;">
                        <div class="moto-info">
                            <div class="moto-info-title">${modeloSeleccionado}</div>
                            <div class="moto-info-desc">${moto.desc}</div>
                        </div>
                    </div>
                `;
            }
            
            actualizarVista();
        });

        creditoGroup.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                creditoSeleccionado = this.dataset.credito;
                engancheSeleccionado = '';
                plazoSeleccionado = '';
                actualizarVista();
            });
        });

        function actualizarVista() {
            document.querySelectorAll('#creditoGroup .btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#engancheGroup .btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#plazoGroup .btn').forEach(b => b.classList.remove('active'));
            cotizacionContainer.innerHTML = '';

            if (!modeloSeleccionado) return;

            if (creditoSeleccionado) {
                document.querySelectorAll('#creditoGroup .btn').forEach(b => {
                    if (b.dataset.credito === creditoSeleccionado) b.classList.add('active');
                });

                const datosModelo = datos[modeloSeleccionado];
                const planData = datosModelo.planes[creditoSeleccionado];
                
                engancheGroup.innerHTML = '';
                
                if (creditoSeleccionado === 'MSI') {
                    engancheSection.classList.add('hidden');
                    plazoSection.classList.add('hidden');
                    mostrarCotizacionMSI();
                } else {
                    engancheSection.classList.remove('hidden');
                    plazoSection.classList.remove('hidden');
                    
                    Object.keys(planData).forEach(enganche => {
                        const btn = document.createElement('button');
                        btn.className = 'btn';
                        btn.textContent = enganche;
                        btn.addEventListener('click', function() {
                            engancheSeleccionado = enganche;
                            actualizarPlazo();
                        });
                        engancheGroup.appendChild(btn);
                    });
                }
            } else {
                engancheSection.classList.add('hidden');
                plazoSection.classList.add('hidden');
            }
        }

        function actualizarPlazo() {
            document.querySelectorAll('#engancheGroup .btn').forEach(b => b.classList.remove('active'));
            plazoGroup.innerHTML = '';
            cotizacionContainer.innerHTML = '';

            if (engancheSeleccionado) {
                document.querySelectorAll('#engancheGroup .btn').forEach(b => {
                    if (b.textContent === engancheSeleccionado) b.classList.add('active');
                });

                const datosModelo = datos[modeloSeleccionado];
                const cuotas = datosModelo.planes[creditoSeleccionado][engancheSeleccionado].cuotas;

                Object.keys(cuotas).forEach(plazo => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.textContent = plazo + 'Q';
                    btn.addEventListener('click', function() {
                        plazoSeleccionado = plazo;
                        mostrarCotizacion();
                    });
                    plazoGroup.appendChild(btn);
                });
            }
        }

        function mostrarCotizacion() {
            document.querySelectorAll('#plazoGroup .btn').forEach(b => b.classList.remove('active'));
            
            if (plazoSeleccionado) {
                document.querySelectorAll('#plazoGroup .btn').forEach(b => {
                    if (b.textContent === plazoSeleccionado + 'Q') b.classList.add('active');
                });

                const datosModelo = datos[modeloSeleccionado];
                const planData = datosModelo.planes[creditoSeleccionado][engancheSeleccionado];
                const enganche = planData.enganche;
                const cuota = planData.cuotas[plazoSeleccionado];
                const totalQuincenas = parseInt(plazoSeleccionado);
                const totalPagado = enganche + (cuota * totalQuincenas);

                let html = `
                    <div class="cotizacion">
                        <h2>💰 Tu Cotización</h2>
                        <div class="cotizacion-grid">
                            <div class="cotizacion-item">
                                <div class="cotizacion-label">Enganche</div>
                                <div class="cotizacion-valor">$${enganche.toLocaleString('es-MX')}</div>
                            </div>
                            <div class="cotizacion-item">
                                <div class="cotizacion-label">Cuota Quincenal</div>
                                <div class="cotizacion-valor">$${cuota.toLocaleString('es-MX')}</div>
                            </div>
                            <div class="cotizacion-item">
                                <div class="cotizacion-label">Total de Cuotas</div>
                                <div class="cotizacion-valor">${totalQuincenas} (${(totalQuincenas / 2).toFixed(0)} meses)</div>
                            </div>
                            <div class="cotizacion-total">
                                <span class="cotizacion-total-label">Precio Total</span>
                                <span class="cotizacion-total-valor">$${totalPagado.toLocaleString('es-MX')}</span>
                            </div>
                        </div>
                        <div class="cotizacion-actions">
                            <button class="btn-action btn-whatsapp" onclick="enviarPorWhatsApp('${modeloSeleccionado}', '${creditoSeleccionado}', '${engancheSeleccionado}', '${plazoSeleccionado}', ${enganche}, ${cuota}, ${totalQuincenas}, ${totalPagado})">
                                💬 WhatsApp
                            </button>
                            <button class="btn-action btn-email" onclick="enviarPorEmail('${modeloSeleccionado}', '${creditoSeleccionado}', '${engancheSeleccionado}', '${plazoSeleccionado}', ${enganche}, ${cuota}, ${totalQuincenas}, ${totalPagado})">
                                📧 Email
                            </button>
                        </div>
                    </div>
                `;

                cotizacionContainer.innerHTML = html;
            }
        }

        function mostrarCotizacionMSI() {
            const datosModelo = datos[modeloSeleccionado];
            const precio = datosModelo.planes.MSI.precio;

            let html = `
                <div class="cotizacion">
                    <h2>💳 Tu Cotización MSI</h2>
                    <div class="cotizacion-grid">
                        <div class="cotizacion-item">
                            <div class="cotizacion-label">Precio de Contado</div>
                            <div class="cotizacion-valor">$${precio.toLocaleString('es-MX')}</div>
                        </div>
                        <div class="cotizacion-total">
                            <span class="cotizacion-total-label">Sin Intereses</span>
                            <span class="cotizacion-total-valor">$${precio.toLocaleString('es-MX')}</span>
                        </div>
                    </div>
                    <div class="cotizacion-actions">
                        <button class="btn-action btn-whatsapp" onclick="enviarMSIPorWhatsApp('${modeloSeleccionado}', ${precio})">
                            💬 WhatsApp
                        </button>
                        <button class="btn-action btn-email" onclick="enviarMSIPorEmail('${modeloSeleccionado}', ${precio})">
                            📧 Email
                        </button>
                    </div>
                </div>
            `;

            cotizacionContainer.innerHTML = html;
        }

        // ===== WHATSAPP INTEGRATION =====
        const whatsappBtn = document.getElementById('whatsappBtn');
        const whatsappModal = document.getElementById('whatsappModal');
        const whatsappClose = document.getElementById('whatsappClose');
        const whatsappSendBtn = document.getElementById('whatsappSendBtn');
        const whatsappName = document.getElementById('whatsappName');
        const whatsappEmail = document.getElementById('whatsappEmail');
        const whatsappMessage = document.getElementById('whatsappMessage');

        // WhatsApp Number (DINAMO)
        const DINAMO_WHATSAPP = '5212282364842'; // WhatsApp oficial DINAMO

        whatsappBtn.addEventListener('click', () => {
            whatsappModal.classList.toggle('hidden');
        });

        whatsappClose.addEventListener('click', () => {
            whatsappModal.classList.add('hidden');
        });

        whatsappSendBtn.addEventListener('click', () => {
            const nombre = whatsappName.value.trim();
            const email = whatsappEmail.value.trim();
            const mensaje = whatsappMessage.value.trim();

            if (!nombre) {
                alert('Por favor ingresa tu nombre');
                whatsappName.focus();
                return;
            }

            if (!mensaje) {
                alert('Por favor escribe un mensaje');
                whatsappMessage.focus();
                return;
            }

            // Construir el mensaje con información de cotización
            let cotizacionInfo = '';
            if (modeloSeleccionado) {
                cotizacionInfo = `\n\n📋 *Detalles de Cotización:*\n`;
                cotizacionInfo += `🏍 *Modelo:* ${modeloSeleccionado}\n`;
                if (creditoSeleccionado) {
                    cotizacionInfo += `💳 *Financiamiento:* ${creditoSeleccionado}\n`;
                }
                if (engancheSeleccionado) {
                    cotizacionInfo += `💰 *Enganche:* ${engancheSeleccionado}\n`;
                }
                if (plazoSeleccionado) {
                    cotizacionInfo += `📅 *Plazo:* ${plazoSeleccionado} quincenas\n`;
                }
            }

            const mensajeCompleto = `Hola DINAMO 👋\n\nMi nombre es: ${nombre}${email ? `\nCorreo: ${email}` : ''}\n\n📝 *Mensaje:*\n${mensaje}${cotizacionInfo}`;

            // URL de WhatsApp
            const whatsappURL = `https://wa.me/${DINAMO_WHATSAPP}?text=${encodeURIComponent(mensajeCompleto)}`;

            // Abrir WhatsApp
            window.open(whatsappURL, '_blank');

            // Limpiar formulario
            whatsappName.value = '';
            whatsappEmail.value = '';
            whatsappMessage.value = '';
            whatsappModal.classList.add('hidden');
        });

        // Enter para enviar en textarea
        whatsappMessage.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                whatsappSendBtn.click();
            }
        });

        // Cerrar modal al hacer click fuera
        document.addEventListener('click', (e) => {
            if (!whatsappModal.contains(e.target) && e.target !== whatsappBtn) {
                whatsappModal.classList.add('hidden');
            }
        });

        // ===== FUNCIONES DE ENVÍO DE COTIZACIÓN =====

        function enviarPorWhatsApp(modelo, credito, enganche, plazo, engancheVal, cuota, totalQuincenas, totalPagado) {
            const mensaje = `🏍️ *COTIZACIÓN DINAMO*\n\n` +
                `📋 *Modelo:* ${modelo}\n` +
                `💳 *Financiamiento:* ${credito}\n` +
                `💰 *Enganche:* $${engancheVal.toLocaleString('es-MX')}\n` +
                `📅 *Plazo:* ${totalQuincenas} quincenas (${(totalQuincenas / 2).toFixed(0)} meses)\n` +
                `💵 *Cuota Quincenal:* $${cuota.toLocaleString('es-MX')}\n\n` +
                `✅ *Precio Total:* $${totalPagado.toLocaleString('es-MX')}\n\n` +
                `¿Te interesa? Contáctame para más información. 🙌`;

            const whatsappURL = `https://wa.me/5212282364842?text=${encodeURIComponent(mensaje)}`;
            window.open(whatsappURL, '_blank');
        }

        function enviarMSIPorWhatsApp(modelo, precio) {
            const mensaje = `🏍️ *COTIZACIÓN DINAMO - MSI*\n\n` +
                `📋 *Modelo:* ${modelo}\n` +
                `💳 *Plan:* MSI (0% de intereses)\n` +
                `✅ *Precio:* $${precio.toLocaleString('es-MX')}\n\n` +
                `¿Te interesa financiar sin intereses? Contáctame. 🙌`;

            const whatsappURL = `https://wa.me/5212282364842?text=${encodeURIComponent(mensaje)}`;
            window.open(whatsappURL, '_blank');
        }

        function enviarPorEmail(modelo, credito, enganche, plazo, engancheVal, cuota, totalQuincenas, totalPagado) {
            const asunto = `Cotización DINAMO - ${modelo}`;
            const cuerpo = `Hola DINAMO,%0D%0A%0D%0A` +
                `Estoy interesado en la siguiente cotización:%0D%0A%0D%0A` +
                `🏍️ MODELO: ${modelo}%0D%0A` +
                `💳 FINANCIAMIENTO: ${credito}%0D%0A` +
                `💰 ENGANCHE: $${engancheVal.toLocaleString('es-MX')}%0D%0A` +
                `📅 PLAZO: ${totalQuincenas} quincenas (${(totalQuincenas / 2).toFixed(0)} meses)%0D%0A` +
                `💵 CUOTA QUINCENAL: $${cuota.toLocaleString('es-MX')}%0D%0A%0D%0A` +
                `✅ PRECIO TOTAL: $${totalPagado.toLocaleString('es-MX')}%0D%0A%0D%0A` +
                `Favor de contactarme para confirmar la cotización.%0D%0A%0D%0A` +
                `Saludos.`;

            const emailURL = `mailto:contacto@dinamotos.mx?subject=${encodeURIComponent(asunto)}&body=${cuerpo}`;
            window.open(emailURL, '_blank');
        }

        function enviarMSIPorEmail(modelo, precio) {
            const asunto = `Cotización MSI DINAMO - ${modelo}`;
            const cuerpo = `Hola DINAMO,%0D%0A%0D%0A` +
                `Estoy interesado en la siguiente cotización:%0D%0A%0D%0A` +
                `🏍️ MODELO: ${modelo}%0D%0A` +
                `💳 PLAN: MSI (0% de intereses)%0D%0A` +
                `✅ PRECIO: $${precio.toLocaleString('es-MX')}%0D%0A%0D%0A` +
                `Quiero financiar sin intereses. Favor de contactarme.%0D%0A%0D%0A` +
                `Saludos.`;

            const emailURL = `mailto:contacto@dinamotos.mx?subject=${encodeURIComponent(asunto)}&body=${cuerpo}`;
            window.open(emailURL, '_blank');
        }
    </script>
